<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">A change in materials, a familiar name</title><desc id="d">Two labeled stages contrast wooden heads and later hollow metal or composite heads.</desc><rect width="1000" height="500" rx="16" fill="#f5f1e7"/><g font-family="Arial,sans-serif" fill="#173e32"><text x="50" y="60" font-size="30" font-weight="bold">A change in materials, a familiar name</text><rect x="70" y="155" width="370" height="195" rx="18" fill="#91623e"/><rect x="560" y="155" width="370" height="195" rx="18" fill="#245c46"/><g text-anchor="middle" fill="#fffdf6"><text x="255" y="215" font-size="28">Wooden heads</text><text x="255" y="266" font-size="21">Persimmon / laminated maple</text><text x="745" y="215" font-size="28">Hollow heads</text><text x="745" y="266" font-size="21">Metal / composite construction</text></g><path d="M462 250H532l-14-12m14 12l-14 12" fill="none" stroke="#173e32" stroke-width="4"/><text x="500" y="402" text-anchor="middle" font-size="21">The word “wood” remains a club-family name.</text><text x="50" y="465" font-size="17">Conceptual illustration • Not a product specification</text></g></svg>